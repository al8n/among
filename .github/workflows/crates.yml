name: Crates.io

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify crate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update

      - name: Verify release tag
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(
            cargo +1.85.0 metadata --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "among") | .version'
          )"
          if [[ "${GITHUB_REF_NAME}" != "v${manifest_version}" ]]; then
            printf 'tag/version mismatch: expected v%s, got %s\n' \
              "${manifest_version}" "${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Run prepublish checks
        run: |
          cargo +1.85.0 test -p among --all-features
          cargo +1.85.0 package -p among
          cargo +1.85.0 publish -p among --dry-run

  publish:
    name: Publish crate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    concurrency:
      group: among-crates-io-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(
            cargo +1.85.0 metadata --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "among") | .version'
          )"
          if [[ "${GITHUB_REF_NAME}" != "v${manifest_version}" ]]; then
            printf 'tag/version mismatch: expected v%s, got %s\n' \
              "${manifest_version}" "${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Generate release lockfile
        run: cargo +1.85.0 generate-lockfile

      - name: Verify locked package
        run: cargo +1.85.0 publish -p among --locked --dry-run

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish among
        run: cargo +1.85.0 publish -p among --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
