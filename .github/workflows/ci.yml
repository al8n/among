name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  nightly: nightly
  stable: stable

jobs:
  # Check formatting
  rustfmt:
    name: rustfmt
    strategy:
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
        run: rustup update stable --no-self-update && rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Install Clippy for Rust 1.85.0
        run: rustup component add clippy --toolchain 1.85.0
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: Check the MSRV feature powerset
        run: cargo +1.85.0 hack check --feature-powerset
      - name: Test the MSRV feature powerset
        run: cargo +1.85.0 hack test --feature-powerset
      - name: Lint the MSRV feature powerset
        run: cargo +1.85.0 hack clippy --feature-powerset --all-targets -- -D warnings

  bare-metal:
    name: bare-metal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85.0 and the bare-metal target
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup target add thumbv6m-none-eabi --toolchain 1.85.0
      - name: Check no_std feature combinations
        run: |
          cargo +1.85.0 check --target thumbv6m-none-eabi --no-default-features
          cargo +1.85.0 check --target thumbv6m-none-eabi --no-default-features --features either
          cargo +1.85.0 check --target thumbv6m-none-eabi --no-default-features --features serde
          cargo +1.85.0 check --target thumbv6m-none-eabi --no-default-features --features either,serde

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Build strict documentation
        env:
          RUSTDOCFLAGS: "-D warnings -D missing-docs"
        run: cargo +1.85.0 doc --all-features --no-deps

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Verify the package
        run: cargo +1.85.0 package

  semver-checks:
    name: semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check SemVer compatibility against 0.2.0
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-version: 0.2.0
          feature-group: all-features
          release-type: major

  # Apply clippy lints
  clippy:
    name: clippy
    needs:
      - msrv
      - bare-metal
      - docs
      - package
      - semver-checks
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: Apply clippy lints
        run: cargo hack clippy --feature-powerset --all-targets -- -D warnings

  # Run tests on some extra platforms
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --target ${{ matrix.target }}

  build:
    name: build
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-
      - name: Install Rust
        # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: Cache ~/.cargo
        uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-coverage-dotcargo
      - name: Run build
        run: cargo hack build --feature-powerset

  test:
    name: test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-
      - name: Install Rust
        # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: Cache ~/.cargo
        uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-coverage-dotcargo
      - name: Run test
        run: cargo hack test --feature-powerset 

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - msrv
      - bare-metal
      - docs
      - package
      - semver-checks
      - clippy
      - build
      - cross
      - test
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly Rust with LLVM tools
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview --no-self-update
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache cargo registry and git
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-coverage-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-cargo-
      - name: Run LLVM coverage
        run: cargo +nightly llvm-cov --workspace --all-features --doctests --lcov --output-path lcov.info
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
          files: ./lcov.info
          disable_search: true
