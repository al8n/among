[package]
name = "among"
version = "1.0.0"
edition = "2018"
resolver = "2"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/al8n/among"
homepage = "https://github.com/al8n/among"
documentation = "https://docs.rs/among"
description = "A general purpose sum type with three cases: the enum `Among` with variants `Left`, `Middle` and `Right`. A three-way counterpart to `Either`, with `no_std`, `serde`, `futures` and `tokio` integrations."

keywords = ["data-structure", "no-std", "either", "sum-type", "enum"]
categories = ["data-structures", "no-std", "no-std::no-alloc", "rust-patterns"]

[features]
default = ["std"]
std = ["either?/use_std", "futures-io?/std", "serde?/std"]

either = ["dep:either"]
serde = ["dep:serde"]
futures = ["std", "dep:futures-io"]
tokio = ["std", "dep:tokio"]

[dependencies]
either = { version = "1", optional = true, default-features = false }
futures-io = { version = "0.3", optional = true, default-features = false }
tokio = { version = "1", optional = true, default-features = false, features = ["io-util"] }
serde = { version = "1", optional = true, default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
serde_json = "1.0.0"

[package.metadata.release]
no-dev-version = true
tag-name = "v{{version}}"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
features = ["serde", "futures", "either", "tokio"]

[package.metadata.playground]
features = ["serde", "futures", "either", "tokio"]
